<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="manifest.json">
  <title>TravelRadar V2.1 Facebook Reels</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    header{padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;background:#0b1220;color:white;display:flex;justify-content:space-between;align-items:center}
    h1{font-size:22px;margin:0}.badge{font-size:12px;background:#1e40af;padding:6px 9px;border-radius:999px}
    main{padding:14px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 4px 18px #00000008}
    .row{display:flex;gap:10px;align-items:center}.grow{flex:1}.muted{color:var(--muted);font-size:13px}
    input,select,button{font:inherit}.input{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:white}
    button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:600}
    button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef2ff;color:#1d4ed8}
    #map{height:360px;border-radius:15px;overflow:hidden;margin-top:10px}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 5px}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;border:1px solid var(--border);background:white;font-size:13px}.chip.active{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
    .place{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.place:last-child{border-bottom:0}.dot{width:42px;height:42px;border-radius:12px;background:#dbeafe;display:grid;place-items:center;font-size:20px}
    nav{position:sticky;bottom:0;background:#ffffffed;backdrop-filter:blur(12px);padding:10px max(14px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;border-top:1px solid var(--border)}
    nav button{background:transparent;color:var(--muted);padding:7px 12px}.primary{color:var(--accent)}
    .hidden{display:none}.candidateList{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:55vh;overflow-y:auto;padding-right:2px}.candidateBtn{width:100%;text-align:left;background:#fff;color:#111827;border:1px solid var(--border);padding:11px 12px;border-radius:12px;font-weight:500}.candidateBtn.selected{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8}.candidateBtn small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.notifyBtn{background:#eef2ff;color:#1d4ed8;padding:7px 10px;font-size:12px}.notifyBtn.on{background:#dcfce7;color:#166534}
    .switch{position:relative;width:52px;height:30px;display:inline-block;flex:0 0 auto}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;cursor:pointer;transition:.2s}
    .slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0003}
    .switch input:checked+.slider{background:#22c55e}
    .switch input:checked+.slider:before{transform:translateX(22px)}
    .status{margin-top:8px;padding:10px;border-radius:10px;background:#f8fafc}.detected{background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#991b1b}
  </style>
</head>
<body>
<header><div><h1>TravelRadar</h1><div class="muted" style="color:#cbd5e1">Discover places worth saving</div></div><span class="badge">V2.1 Facebook Reels</span></header>
<main>
  <section class="card">
    <div class="row">
      <input id="url" class="input grow" placeholder="Paste Instagram or Facebook Reel URL…">
      <button onclick="prepareReel()">Add</button>
      <button class="secondary" onclick="clearUrl()">Clear</button>
    </div>
    

    <div id="reelForm" class="hidden" style="margin-top:14px">
      <input id="locationInput" class="input" placeholder="Enter place or city manually…">
      <div style="margin-top:10px">
        <label class="muted" for="reelNotifyRadius"><b>Alert radius</b></label>
        <select id="reelNotifyRadius" class="input" style="margin-top:5px">
          <option value="0.5">500 m</option>
          <option value="1">1 km</option>
          <option value="2" selected>2 km</option>
          <option value="5">5 km</option>
          <option value="10">10 km</option>
          <option value="custom">Custom</option>
        </select>
        <input id="reelCustomRadius" class="input hidden" type="number" min="0.1" max="100" step="0.1" placeholder="Custom radius in km" style="margin-top:7px">
      </div>
      <div class="row" style="margin-top:10px">
        <button onclick="analyzeReelWithAI()">📍 Detect from Reel</button>
        <button class="secondary" onclick="detectReelLocation()">Manual location</button>
        <button id="saveBtn" onclick="saveReel()" disabled>Save</button>
        <button class="secondary" onclick="clearReel()">Clear</button>
      </div>
      <div id="locationStatusReel" class="status muted">Paste the Reel URL and tap 📍 Detect from Reel. If the caption does not contain a usable location, enter it manually.</div>
      <div id="aiResult" class="hidden" style="margin-top:10px"></div>
    </div>
  </section>

  <section class="card">
    <div class="row"><div class="grow"><b>Nearby</b><div id="locationStatus" class="muted">Getting your location…</div></div>
      <select id="radius" class="input" style="width:auto" onchange="render()"><option value="0.5">500 m</option><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option><option value="all">All</option></select>
    </div>
    <div class="chips" style="margin-top:10px">
      <button class="chip active" onclick="filterCat('All',this)">All</button><button class="chip" onclick="filterCat('Food',this)">🍝 Food</button><button class="chip" onclick="filterCat('Nature',this)">🌲 Nature</button><button class="chip" onclick="filterCat('Hotel',this)">🏨 Hotel</button><button class="chip" onclick="filterCat('Beach',this)">🏖️ Beach</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="grow"><b>Location notifications</b><div id="notifyStatus" class="muted">Off</div></div>
      <label class="switch" aria-label="Location notifications">
        <input id="notifyToggle" type="checkbox" onchange="toggleGlobalNotifications(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section class="card"><b>Map</b><div id="map"></div></section>

  <section class="card"><div class="row"><div class="grow"><b>Saved places</b><div class="muted" id="count"></div></div><button class="secondary" onclick="seed()">Demo data</button></div><div id="places"></div></section>
</main>
<nav><button class="primary" onclick="scrollTo(0,0)">⌖<br><small>Radar</small></button><button onclick="document.getElementById('url').focus()">＋<br><small>Add Reel</small></button><button onclick="alert('Settings will be expanded in V2.')">⚙<br><small>Settings</small></button></nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='travelradar_v1_places';
window.TRAVELRADAR_AI_PROXY='https://travelradar-ai.alexandru1-moldovan.workers.dev';
let cat='All', user={lat:45.4642,lng:9.19}, map, markers=[];
let places=JSON.parse(localStorage.getItem(KEY)||'[]');
let pendingReel=null;
let detectedLocation=null;
let detectedCandidates=[];
let selectedCandidateIndex=-1;
let notificationPermission=false;
let geoWatchId=null;
let lastUserPosition=null;
let alertCircles=[];
let notificationCooldownMs=60000;

function save(){localStorage.setItem(KEY,JSON.stringify(places));render()}

function isSupportedReelUrl(url){
  try{
    const u=new URL(url);
    const host=u.hostname.toLowerCase().replace(/^www\./,'');
    const path=u.pathname.toLowerCase();

    // Instagram Reels/posts
    if(host==='instagram.com' && /^\/(reel|p)\//.test(path)) return true;

    // Facebook Reels
    if(host==='facebook.com' && /^\/reel(s)?\//.test(path)) return true;

    // Facebook share links. Facebook can return a generic /share/<token>
    // from "Copy link", not only the newer /share/r/<token> format.
    // The target may resolve to a Reel, so let the AI proxy inspect it.
    if(host==='facebook.com' && /^\/share\/(?:r\/)?[^/]+/.test(path)) return true;

    // Facebook short links can redirect to a Reel.
    if(host==='fb.watch' && path.length>1) return true;

    return false;
  }catch(e){
    return false;
  }
}

function getReelPlatform(url){
  try{
    const host=new URL(url).hostname.toLowerCase().replace(/^www\./,'');
    if(host==='facebook.com' || host==='fb.watch') return 'Facebook';
    return 'Instagram';
  }catch(e){
    return 'Reel';
  }
}

function prepareReel(){
  const url=document.getElementById('url').value.trim();
  if(!url){document.getElementById('url').focus();return}
  if(!isSupportedReelUrl(url)){
    alert('Please enter a valid Instagram or Facebook Reel URL.');
    return;
  }
  pendingReel={url};
  detectedLocation=null;
  detectedCandidates=[];
  selectedCandidateIndex=-1;
  document.getElementById('reelNotifyRadius').value='2';
  document.getElementById('reelCustomRadius').value='';
  document.getElementById('reelCustomRadius').classList.add('hidden');
  document.getElementById('reelForm').classList.remove('hidden');
  document.getElementById('locationInput').focus();
  document.getElementById('saveBtn').disabled=true;
  setReelStatus('Tap 📍 Detect from Reel. If automatic detection fails, enter the location manually.','');
}

async function detectReelLocation(){
  const query=document.getElementById('locationInput').value.trim();
  if(!query){setReelStatus('Please enter a place or city first.','error');return}

  const btn=document.querySelector('#reelForm button');
  btn.disabled=true;
  setReelStatus('Searching OpenStreetMap…','');

  try{
    const response=await fetch(
      'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&addressdetails=1&q='+encodeURIComponent(query),
      {headers:{'Accept':'application/json'}}
    );
    if(!response.ok) throw new Error('Geocoding request failed');
    const results=await response.json();

    if(!results.length){
      detectedLocation=null;
      document.getElementById('saveBtn').disabled=true;
      setReelStatus('Location not found. Try a more specific place, city or country.','error');
      return;
    }

    const r=results[0];
    detectedLocation={
      lat:Number(r.lat),
      lng:Number(r.lon),
      location:r.display_name
    };

    document.getElementById('saveBtn').disabled=false;
    setReelStatus('Detected: '+r.display_name,'detected');

    if(map){
      map.setView([detectedLocation.lat,detectedLocation.lng],13);
      if(window.pendingMarker) map.removeLayer(window.pendingMarker);
      window.pendingMarker=L.marker([detectedLocation.lat,detectedLocation.lng])
        .addTo(map)
        .bindPopup('<b>Reel location</b><br>'+escapeHtml(r.display_name))
        .openPopup();
    }
  }catch(e){
    detectedLocation=null;
    document.getElementById('saveBtn').disabled=true;
    setReelStatus('Could not detect the location. Please try again.','error');
  }finally{
    btn.disabled=false;
  }
}

function getSelectedReelRadius(){
  const value=document.getElementById('reelNotifyRadius').value;
  if(value==='custom'){
    const custom=Number(document.getElementById('reelCustomRadius').value);
    if(!Number.isFinite(custom) || custom<0.1 || custom>100){
      alert('Enter a custom alert radius between 0.1 and 100 km.');
      return null;
    }
    return custom;
  }
  return Number(value);
}

function formatRadius(km){
  return km<1 ? `${Math.round(km*1000)} m` : `${km} km`;
}

document.getElementById('reelNotifyRadius').addEventListener('change', e=>{
  const custom=document.getElementById('reelCustomRadius');
  custom.classList.toggle('hidden', e.target.value!=='custom');
  if(e.target.value==='custom') custom.focus();
});

function saveReel(){
  if(!pendingReel || !detectedLocation){
    alert('Detect the Reel location before saving.');
    return;
  }

  const notifyRadius=getSelectedReelRadius();
  if(notifyRadius===null)return;

  places.unshift({
    id:Date.now(),
    title:'Saved from '+getReelPlatform(pendingReel.url)+' Reel',
    category:'Travel',
    url:pendingReel.url,
    platform:getReelPlatform(pendingReel.url),
    lat:detectedLocation.lat,
    lng:detectedLocation.lng,
    location:detectedLocation.location,
    notifyEnabled:true,
    notifyRadius:notifyRadius,
    insideGeofence:false
  });

  document.getElementById('url').value='';
  clearReel();
  save();
  alert('Saved to TravelRadar at the detected Reel location.');
}

function clearUrl(){
  document.getElementById('url').value='';
  clearReel();
  document.getElementById('url').focus();
}

function clearReel(){
  pendingReel=null;
  detectedLocation=null;
  detectedCandidates=[];
  selectedCandidateIndex=-1;
  document.getElementById('reelForm').classList.add('hidden');
  document.getElementById('locationInput').value='';
  document.getElementById('saveBtn').disabled=true;
  document.getElementById('aiResult').classList.add('hidden');
  document.getElementById('aiResult').innerHTML='';
  if(window.pendingMarker && map){
    map.removeLayer(window.pendingMarker);
    window.pendingMarker=null;
  }
}

function setReelStatus(text,type){
  const el=document.getElementById('locationStatusReel');
  el.textContent=text;
  el.className='status muted '+(type||'');
}

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function safeUrl(url){
  try{
    const u=new URL(url,window.location.href);
    return /^https?:$/.test(u.protocol) ? u.href : '#';
  }catch(e){
    return '#';
  }
}


async function toggleGlobalNotifications(enabled){
  if(!enabled){
    notificationPermission=false;
    if(geoWatchId!==null){
      navigator.geolocation?.clearWatch(geoWatchId);
      geoWatchId=null;
    }
    updateNotifyStatus('Off');
    return;
  }

  if(!('Notification' in window)){
    document.getElementById('notifyToggle').checked=false;
    updateNotifyStatus('Not available on this device/browser.','error');
    return;
  }

  try{
    const permission=await Notification.requestPermission();

    if(permission==='granted'){
      notificationPermission=true;
      updateNotifyStatus('On');
      startGeofenceMonitoring();
    }else{
      notificationPermission=false;
      document.getElementById('notifyToggle').checked=false;
      updateNotifyStatus(permission==='denied'?'Blocked in Settings.':'Off','error');
    }
  }catch(e){
    notificationPermission=false;
    document.getElementById('notifyToggle').checked=false;
    updateNotifyStatus('Off','error');
  }
}
function updateNotifyStatus(text,type=''){
  const el=document.getElementById('notifyStatus');
  if(!el)return;
  el.textContent=text;
  el.className='muted '+(type||'');
}

function toggleNotification(id){
  const p=places.find(x=>x.id===id);
  if(!p)return;

  if(!notificationPermission){
    const toggle=document.getElementById('notifyToggle');
    if(toggle) toggle.checked=true;
    toggleGlobalNotifications(true).then(()=>{
      if(notificationPermission) toggleNotification(id);
    });
    return;
  }

  p.notifyEnabled=!p.notifyEnabled;
  const radius=Number(p.notifyRadius||2);

  if(p.notifyEnabled){
    p.insideGeofence=false;
    updateNotifyStatus('On');
  }else{
    p.insideGeofence=false;
  }

  save();
  if(notificationPermission) startGeofenceMonitoring();
}

function startGeofenceMonitoring(){
  if(geoWatchId!==null || !navigator.geolocation)return;

  geoWatchId=navigator.geolocation.watchPosition(
    onGeofencePosition,
    ()=>{
      updateNotifyStatus('GPS unavailable.','error');
    },
    {enableHighAccuracy:true,maximumAge:15000,timeout:20000}
  );
}

function onGeofencePosition(pos){
  lastUserPosition={lat:pos.coords.latitude,lng:pos.coords.longitude};
  user=lastUserPosition;

  const active=places.filter(p=>p.notifyEnabled);
  if(!active.length){
    updateNotifyStatus('On');
    return;
  }

  active.forEach(p=>{
    const d=distance(user.lat,user.lng,p.lat,p.lng);
    const radius=Number(p.notifyRadius||5);

    if(d<=radius && !p.insideGeofence){
      p.insideGeofence=true;
      firePlaceNotification(p,d,radius);
    }else if(d>radius*1.15){
      // Require a meaningful exit before another alert can be generated.
      p.insideGeofence=false;
    }
  });

  localStorage.setItem(KEY,JSON.stringify(places));
  document.getElementById('locationStatus').textContent='Location detected';
  render();
}

function firePlaceNotification(p,d,radius){
  const title='TravelRadar 📍';
  const body=`You are ${d.toFixed(1)} km from ${p.location}.`;

  try{
    if(Notification.permission==='granted'){
      new Notification(title,{
        body,
        tag:'travelradar-'+p.id,
        renotify:true
      });
    }
  }catch(e){
    // On platforms where Notification() is unavailable, the in-app status still updates.
  }

  updateNotifyStatus(`📍 You entered the ${radius} km alert zone for ${p.location}.`);
}

function seed(){
  places=[
   {id:1,title:'Lake Garda viewpoint',category:'Nature',location:'Lake Garda',lat:45.479,lng:10.61,url:'#'},
   {id:2,title:'Sirmione lakeside spot',category:'Beach',location:'Sirmione',lat:45.492,lng:10.61,url:'#'},
   {id:3,title:'Local Italian restaurant',category:'Food',location:'Sirmione',lat:45.496,lng:10.606,url:'#'},
   {id:4,title:'Boutique hotel',category:'Hotel',location:'Sirmione',lat:45.491,lng:10.604,url:'#'}
  ].map(p=>({...p,notifyEnabled:false,insideGeofence:false}));
  save();
}

function filterCat(c,el){
  cat=c;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  render();
}

function distance(a,b,c,d){
  const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180;
  const q=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
  return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}

function deletePlace(id){
  const p=places.find(x=>x.id===id);
  if(!p)return;
  if(!confirm(`Delete "${p.location}" from TravelRadar?`))return;
  places=places.filter(x=>x.id!==id);
  save();
}

function render(){
  const radiusValue=document.getElementById('radius').value;
  const allPlaces=radiusValue==='all';
  const r=allPlaces?Infinity:Number(radiusValue);
  let shown=places.filter(p=>
    (cat==='All'||p.category===cat) &&
    (allPlaces || distance(user.lat,user.lng,p.lat,p.lng)<=r)
  );
  document.getElementById('count').textContent=
    shown.length+' place'+(shown.length===1?'':'s')+
    (allPlaces ? ' · all saved places' : ' within '+r+' km');
  document.getElementById('places').innerHTML=shown.length
    ?shown.map(p=>`<div class="place">
    <div class="dot">📍</div>
    <div class="grow">
      <b>${escapeHtml(p.title)}</b>
      <div class="muted">${escapeHtml(p.location)} · ${distance(user.lat,user.lng,p.lat,p.lng).toFixed(1)} km</div>
      <div class="muted">🔔 Alert radius: ${formatRadius(Number(p.notifyRadius||2))}</div>
      <div style="margin-top:5px">
        <a href="${escapeHtml(p.url)}" target="_blank">View Reel ↗</a>
        ${p.url && p.url !== '#' ? `<button class="notifyBtn ${p.notifyEnabled?'on':''}" onclick="toggleNotification(${p.id})">${p.notifyEnabled?'🔔 On':'🔔 Notify'}</button>` : ''}
        <button class="notifyBtn" onclick="deletePlace(${p.id})" style="background:#fee2e2;color:#991b1b">🗑 Delete</button>
      </div>
    </div>
  </div>`).join('')
    :'<div class="muted" style="padding:15px 0">No saved places in this radius.</div>';

  if(map){
    markers.forEach(m=>map.removeLayer(m));
    markers=[];
    alertCircles.forEach(c=>map.removeLayer(c));
    alertCircles=[];
    shown.forEach(p=>{
      const reelUrl=safeUrl(p.url);
      const alertRadius=Number(p.notifyRadius||2);
      const reelLink=reelUrl!=='#'
        ? `<br><br><a href="${escapeHtml(reelUrl)}" target="_blank" rel="noopener noreferrer" style="font-weight:600">🔗 View Reel ↗</a>`
        : '';
      const deleteLink=`<br><button onclick="deletePlace(${p.id})" style="margin-top:10px;background:#fee2e2;color:#991b1b;padding:7px 10px;border-radius:8px;border:0;font-weight:600">🗑 Delete pin</button>`;
      const marker=L.marker([p.lat,p.lng]).addTo(map).bindPopup(
        `<b>${escapeHtml(p.title)}</b><br>${escapeHtml(p.location)}${reelLink}${deleteLink}`
      );
      markers.push(marker);
      const circle=L.circle([p.lat,p.lng],{
        radius:alertRadius*1000,
        color:'#2563eb',
        fillColor:'#2563eb',
        fillOpacity:0.08,
        weight:1
      }).addTo(map).bindPopup(
        `<b>Alert radius</b><br>${escapeHtml(formatRadius(alertRadius))}`
      );
      alertCircles.push(circle);
    });

    if(allPlaces && shown.length){
      const bounds=L.latLngBounds(
        shown.map(p=>[p.lat,p.lng])
      );
      map.fitBounds(bounds,{padding:[30,30],maxZoom:13});
    }
  }
}

function initMap(){
  map=L.map('map').setView([user.lat,user.lng],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
  L.marker([user.lat,user.lng]).addTo(map).bindPopup('You are here');
  render();
}

navigator.geolocation?.getCurrentPosition(pos=>{
  user={lat:pos.coords.latitude,lng:pos.coords.longitude};
  document.getElementById('locationStatus').textContent='Location detected';
  if(map){
    map.setView([user.lat,user.lng],12);
    render();
  }
  if(notificationPermission) startGeofenceMonitoring();
},()=>{
  document.getElementById('locationStatus').textContent='Using demo location (Milan)';
});

notificationPermission=false;
document.getElementById('notifyToggle').checked=false;
updateNotifyStatus('Off');
initMap();
</script>

<script>
async function analyzeReelWithAI(){
  const url=document.getElementById('url').value.trim();
  if(!url){
    alert('Paste an Instagram or Facebook Reel URL first.');
    return;
  }

  if(!window.TRAVELRADAR_AI_PROXY){
    setReelStatus('AI proxy is not configured. Use Manual location.','error');
    document.getElementById('reelForm').classList.remove('hidden');
    return;
  }

  pendingReel={url};
  detectedLocation=null;
  detectedCandidates=[];
  selectedCandidateIndex=-1;

  document.getElementById('reelForm').classList.remove('hidden');
  document.getElementById('saveBtn').disabled=true;
  document.getElementById('aiResult').classList.remove('hidden');
  document.getElementById('aiResult').innerHTML=
    '<div class="status">🔎 Reading the public Reel caption…</div>';

  setReelStatus(
    'Reading the public Reel caption…',
    ''
  );

  try{
    const response=await fetch(
      window.TRAVELRADAR_AI_PROXY+
      '/metadata?url='+
      encodeURIComponent(url),
      {cache:'no-store'}
    );

    let data=null;

    try{
      data=await response.json();
    }catch(_){
      data=null;
    }

    if(
      !response.ok ||
      !data ||
      data.error
    ){
      throw new Error(
        data?.error ||
        ('Worker request failed (HTTP '+
          response.status+
          ')')
      );
    }

    const candidates=Array.isArray(
      data.location_candidates
    )
      ? data.location_candidates
          .filter(Boolean)
          .map(x=>cleanCandidateText(x))
          .filter(Boolean)
      : [];

    // Remove duplicates while preserving order.
    detectedCandidates=[
      ...new Set(candidates)
    ];

    const caption=
      data.caption ||
      data.og_description ||
      '';

    // No candidates at all.
    if(!detectedCandidates.length){

      document.getElementById('aiResult').innerHTML=
        `<div class="status error">
          ⚠️ No location candidates were found in the Reel caption.
          <br><br>
          <span class="muted">
            Enter the location manually below.
          </span>
        </div>`;

      setReelStatus(
        'No usable location was found. Enter it manually.',
        'error'
      );

      document.getElementById(
        'locationInput'
      ).focus();

      return;
    }

    /*
     * IMPORTANT:
     * We deliberately do NOT automatically accept the Worker's
     * geocoded result anymore.
     *
     * The user chooses the final candidate.
     */

    document.getElementById('locationInput').value='';

    renderLocationCandidates(
      detectedCandidates,
      data,
      caption
    );

    setReelStatus(
      'Choose the location you want to save.',
      'detected'
    );

  }catch(e){

    console.warn(
      'Reel location detection failed:',
      e
    );

    document.getElementById('aiResult').innerHTML=
      `<div class="status error">
        ⚠️ Automatic detection failed.
        <br>
        <span class="muted">
          ${escapeHtml(
            e.message ||
            'The Reel caption could not be used.'
          )}
        </span>
        <br><br>
        Enter the location manually below.
      </div>`;

    setReelStatus(
      'Automatic detection failed. Enter the location manually.',
      'error'
    );

    document.getElementById(
      'locationInput'
    ).focus();
  }
}


function cleanCandidateText(value){

  let text=String(value||'')
    .replace(/[\u0000-\u001f]/g,' ')
    .replace(/\s+/g,' ')
    .trim();

  // Remove common mojibake flag / emoji sequences when they are
  // attached to an otherwise useful place name.
  text=text
    .replace(/\s*ðŸ‡[\s\S]{0,8}?(?=\s|$)/iu,' ')
    .replace(/\s*ðŸ“\s*/iu,' ')
    .replace(/^["“”]+|["“”]+$/g,'');

  // Strip hashtags from candidate labels.
  text=text.replace(/#[A-Za-z0-9_]+/g,' ');

  // If a candidate is "Peschiera del Garda ... Lake Garda, Italy",
  // prefer the exact municipality phrase.
  const municipality=text.match(
    /\b([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ'’-]{2,50}\s+(?:del|sul)\s+Garda)\b/iu
  );

  if(municipality){
    return municipality[1].trim();
  }

  return text
    .replace(/\s+/g,' ')
    .trim();
}


function renderLocationCandidates(
  candidates,
  data,
  caption
){

  const list=candidates.map(
    (candidate,index)=>`
      <button
        type="button"
        class="candidateBtn"
        id="candidate-${index}"
        onclick="selectLocationCandidate(${index})"
      >
        📍 ${escapeHtml(candidate)}
        ${index===0
          ? '<small>Suggested first — you choose whether to use it.</small>'
          : ''}
      </button>
    `
  ).join('');

  const workerBest=
    data?.matched_candidate
      ? `<br><span class="muted">
           Worker suggestion: ${escapeHtml(
             cleanCandidateText(
               data.matched_candidate
             )
           )}
         </span>`
      : '';

  const captionLine=caption
    ? `<br><br><span class="muted">
         Caption: ${escapeHtml(caption)}
       </span>`
    : '';

  document.getElementById('aiResult').innerHTML=
    `<div class="status detected">
      <b>📍 Choose the location</b>
      <br>
      <span class="muted">
        TravelRadar found these location clues in the caption.
        Select the one you want to use.
      </span>
      <div class="candidateList">
        ${list}
      </div>
      ${workerBest}
      ${captionLine}
    </div>`;
}


async function selectLocationCandidate(index){

  if(
    !detectedCandidates[index] ||
    !pendingReel
  ){
    return;
  }

  selectedCandidateIndex=index;

  const candidate=
    detectedCandidates[index];

  document
    .querySelectorAll('.candidateBtn')
    .forEach(
      btn=>btn.classList.remove('selected')
    );

  const selectedButton=
    document.getElementById(
      'candidate-'+index
    );

  if(selectedButton){
    selectedButton.classList.add('selected');
  }

  setReelStatus(
    'Mapping "'+candidate+'"…',
    ''
  );

  document.getElementById(
    'saveBtn'
  ).disabled=true;

  try{

    /*
     * Geocode the USER'S selection, not the Worker's
     * previously selected result.
     */
    const query =
      /\b(?:del|sul)\s+Garda\b/i.test(candidate)
        ? candidate+', Italy'
        : candidate;

    const response=
      await fetch(
        'https://nominatim.openstreetmap.org/search?'+
        new URLSearchParams({
          format:'jsonv2',
          limit:'5',
          addressdetails:'1',
          'accept-language':'en',
          q:query
        }),
        {
          headers:{
            'Accept':'application/json'
          }
        }
      );

    if(!response.ok){
      throw new Error(
        'Geocoding request failed.'
      );
    }

    const results=
      await response.json();

    if(!results.length){
      throw new Error(
        'The selected location could not be mapped.'
      );
    }

    /*
     * Prefer a settlement result for municipality-style
     * candidates, but never silently change the user's
     * selected candidate.
     */
    let result=results[0];

    if(
      /\b(?:del|sul)\s+Garda\b/i.test(candidate)
    ){

      const settlement=
        results.find(r=>
          ['city','town','village'].includes(
            String(r.type||'').toLowerCase()
          )
        );

      if(settlement){
        result=settlement;
      }
    }

    detectedLocation={
      lat:Number(result.lat),
      lng:Number(result.lon),
      location:result.display_name ||
        candidate
    };

    document.getElementById(
      'locationInput'
    ).value=
      detectedLocation.location;

    document.getElementById(
      'saveBtn'
    ).disabled=false;

    setReelStatus(
      'Selected: '+detectedLocation.location,
      'detected'
    );

    const aiResult=
      document.getElementById(
        'aiResult'
      );

    aiResult.innerHTML=
      `<div class="status detected">
        <b>✓ Location selected</b>
        <br><br>
        <b>${escapeHtml(candidate)}</b>
        <br>
        ${escapeHtml(
          detectedLocation.location
        )}
        <br>
        <span class="muted">
          ${detectedLocation.lat.toFixed(5)},
          ${detectedLocation.lng.toFixed(5)}
        </span>
        <br><br>
        <button
          type="button"
          class="secondary"
          onclick="showCandidateChooser()"
        >
          Change selection
        </button>
      </div>`;

    showPendingLocation(
      'Selected Reel location'
    );

  }catch(error){

    detectedLocation=null;

    document.getElementById(
      'saveBtn'
    ).disabled=true;

    setReelStatus(
      error.message ||
      'Could not map the selected location.',
      'error'
    );

    document.getElementById(
      'locationInput'
    ).value=candidate;
  }
}


function showCandidateChooser(){

  const candidates=
    detectedCandidates;

  if(!candidates.length){
    return;
  }

  renderLocationCandidates(
    candidates,
    {},
    ''
  );

  setReelStatus(
    'Choose the location you want to save.',
    'detected'
  );
}
function showPendingLocation(popupTitle){
  if(!map || !detectedLocation)return;
  if(window.pendingMarker)map.removeLayer(window.pendingMarker);
  window.pendingMarker=L.marker([detectedLocation.lat,detectedLocation.lng])
    .addTo(map)
    .bindPopup('<b>'+escapeHtml(popupTitle)+'</b><br>'+escapeHtml(detectedLocation.location))
    .openPopup();
  map.setView([detectedLocation.lat,detectedLocation.lng],12);
}

window.analyzeReelWithAI=analyzeReelWithAI;
</script>
